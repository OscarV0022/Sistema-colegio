<div class="container mt-5 mb-5" *ngIf="perfil">
  <button class="btn btn-link text-decoration-none mb-3 p-0" (click)="regresar()">
    <i class="bi bi-arrow-left"></i> Volver a la lista
  </button>

  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-body text-center p-4">
          <div class="avatar-circle mx-auto mb-3 bg-primary bg-opacity-10 d-flex align-items-center justify-content-center" 
               style="width: 100px; height: 100px; border-radius: 50%;">
            <i class="bi bi-person text-primary" style="font-size: 3rem;"></i>
          </div>
          <h4 class="fw-bold mb-1">{{ perfil.nombre }}</h4>
          <p class="text-muted small mb-3">Carné: {{ perfil.carnet }}</p>
          <hr>
          <div class="text-start">
            <p class="mb-2"><strong><i class="bi bi-envelope me-2 text-muted"></i>Email:</strong><br>{{ perfil.email }}</p>
            <p class="mb-2"><strong><i class="bi bi-calendar-event me-2 text-muted"></i>Edad:</strong> {{ perfil.edad }} años</p>
            <p class="mb-0"><strong><i class="bi bi-mortarboard me-2 text-muted"></i>Grado Actual:</strong><br>{{ perfil.grado }}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card border-0 shadow-sm h-100">
        <div class="card-header bg-white border-0 py-3">
          <h5 class="mb-0 fw-bold text-dark"><i class="bi bi-journal-check me-2 text-success"></i>Cursos Inscritos</h5>
        </div>
        <div class="card-body p-0">
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex align-items-center py-3 px-4" *ngFor="let curso of perfil.cursos">
              <div class="me-3 p-2 bg-light rounded text-success">
                <i class="bi bi-check2-all"></i>
              </div>
              <div>
                <span class="fw-medium">{{ curso }}</span>
                <div class="small text-muted">Ciclo Escolar 2026</div>
              </div>
            </li>
            <li class="list-group-item text-center py-5" *ngIf="perfil.cursos.length === 0">
              <i class="bi bi-exclamation-circle text-warning display-6"></i>
              <p class="mt-3 mb-0">Este estudiante no tiene cursos asignados actualmente en la tabla de inscripciones.</p>
              <button class="btn btn-primary btn-sm mt-3">Asignar Materias</button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
