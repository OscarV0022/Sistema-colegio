<div class="container mt-5 animate__animated animate__fadeIn">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0 border-top border-5 border-success">
        
        <div class="card-header bg-white py-4 text-center">
          <h2 class="fw-bold text-success mb-0">
            <i class="bi bi-person-plus-fill me-2"></i>Inscripción de Estudiantes
          </h2>
          <p class="text-muted mt-2">Complete los datos para generar el expediente y asignar cursos automáticamente.</p>
        </div>

        <div class="card-body p-4 p-md-5">
          <form (ngSubmit)="registrar()">
            <div class="row g-4">
              
              <div class="col-md-6">
                <label class="form-label fw-bold">Número de Carné</label>
                <input type="text" class="form-control form-control-lg shadow-sm" 
                       [(ngModel)]="nuevo.carnet" name="carnet" placeholder="Ej: 2026-001" required>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">Grado Académico</label>
                <select class="form-select form-select-lg shadow-sm" 
                        [(ngModel)]="nuevo.grado_actual" name="grado_actual" required>
                  <option value="" disabled selected>Seleccione el nivel...</option>
                  <option *ngFor="let g of listaGrados" [value]="g.grado">
                    {{ g.grado }}
                  </option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">Nombre Completo del Estudiante</label>
                <input type="text" class="form-control form-control-lg shadow-sm" 
                       [(ngModel)]="nuevo.nombre" name="nombre" placeholder="Nombres y Apellidos" required>
              </div>

              <div class="col-md-4">
                <label class="form-label fw-bold">Edad</label>
                <input type="number" class="form-control form-control-lg shadow-sm" 
                       [(ngModel)]="nuevo.edad" name="edad" required>
              </div>

              <div class="col-md-8">
                <label class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" class="form-control form-control-lg shadow-sm" 
                       [(ngModel)]="nuevo.email" name="email" placeholder="usuario@udv.edu.gt" required>
              </div>

              <div class="col-12">
                <label class="form-label fw-bold">Contraseña de Acceso</label>
                <input type="password" class="form-control form-control-lg shadow-sm" 
                       [(ngModel)]="nuevo.password" name="password" required>
                <div class="form-text">Esta clave permitirá al alumno revisar sus notas asignadas.</div>
              </div>

            </div>

            <div class="mt-5">
              <button type="submit" class="btn btn-success btn-lg w-100 fw-bold py-3 shadow">
                <i class="bi bi-check-circle-fill me-2"></i> Procesar Inscripción Legal
              </button>
            </div>

          </form>
        </div>

        <div class="card-footer bg-light text-center py-3">
          <small class="text-muted italic">Módulo de Control Escolar - Universidad Da Vinci de Guatemala</small>
        </div>

      </div>
    </div>
  </div>
</div>
