<div class="container mt-5 animate__animated animate__fadeIn">
  
  <div class="row mb-5">
    <div class="col-12 text-center text-lg-start d-lg-flex align-items-center justify-content-between bg-white p-4 rounded-4 shadow-sm border-start border-5 border-primary">
      <div>
        <h1 class="fw-bold mb-1">Bienvenido, <span class="text-primary">{{ nombreDocente }}</span>!</h1>
        <p class="text-muted mb-0">Gestión de cursos asignados - Ciclo 2026.</p>
      </div>
      <div class="mt-3 mt-lg-0">
        <span class="badge bg-primary p-2 px-3 shadow-sm">Docente Activo</span>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let curso of cursos">
      <div class="card h-100 shadow-sm border-0 border-top border-4 border-primary shadow-hover">
        <div class="card-body p-4 d-flex flex-column">
          <div class="d-flex justify-content-between mb-3">
            <div class="bg-primary bg-opacity-10 p-2 rounded">
              <i class="bi bi-journal-bookmark-fill fs-3 text-primary"></i>
            </div>
            <span class="badge bg-light text-primary border border-primary border-opacity-25">{{ curso.grado }}</span>
          </div>
          
          <h4 class="fw-bold text-dark">{{ curso.nombre_curso }}</h4>
          <p class="text-muted small flex-grow-1">{{ curso.descripcion || 'Sin descripción.' }}</p>
          
          <hr class="opacity-25">
          
          <a [routerLink]="['/docente/curso', curso.id]" class="btn btn-primary w-100 fw-bold">
            <i class="bi bi-pencil-square me-2"></i>Gestionar Curso
          </a>
        </div>
      </div>
    </div>

    <div class="col-12 text-center py-5" *ngIf="cursos.length === 0">
      <div class="bg-white p-5 rounded shadow-sm">
        <i class="bi bi-cloud-slash fs-1 text-muted"></i>
        <p class="mt-3 mb-0 text-muted">No se encontraron cursos vinculados a tu ID en MariaDB.</p>
      </div>
    </div>
  </div>
</div>
