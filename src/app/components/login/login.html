<div class="auth-wrapper">
  <div class="auth-content animate__animated animate__fadeIn">
    
    <div class="auth-header text-center">
      <div class="brand-logo">
        <i class="bi bi-rocket-takeoff-fill"></i>
      </div>
      <h1>Colegio XP</h1>
      <p>Gestión Académica Digital</p>
    </div>

    <form (submit)="onLogin()" class="auth-form">
      
      <div class="form-field">
        <label>Número de Carné</label>
        <div class="input-wrapper">
          <i class="bi bi-hash"></i>
          <input type="text" name="carnet" [(ngModel)]="carnet" 
                 placeholder="Ej. 2026-ADMIN" required>
        </div>
      </div>

      <div class="form-field">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <i class="bi bi-shield-lock"></i>
          <input type="password" name="password" [(ngModel)]="password" 
                 placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">
        <span>Ingresar al Portal</span>
        <i class="bi bi-chevron-right"></i>
      </button>

    </form>

    <div class="auth-footer text-center">
      <span class="status-dot"></span>
      Sistema Operativo v2.1.0
    </div>
  </div>
</div>
