<div class="container mt-5 animate__animated animate__fadeIn">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">
      
      <div class="card shadow-lg border-0 overflow-hidden">
        <div class="card-header bg-dark text-white p-5 d-flex align-items-center">
          <div class="position-relative me-4">
            <img [src]="imgPreview || 'https://via.placeholder.com/150'" 
                 class="rounded-circle border border-4 border-primary shadow-sm" 
                 style="width: 150px; height: 150px; object-fit: cover;">
            
            <label for="fileFoto" class="btn btn-primary btn-sm position-absolute bottom-0 end-0 rounded-circle shadow">
              <i class="bi bi-camera-fill"></i>
            </label>
            <input type="file" id="fileFoto" class="d-none" (change)="onFileSelected($event)" accept="image/*">
          </div>
          
          <div>
            <h1 class="fw-bold mb-0 text-white">{{ usuario.nombre }}</h1>
            <span class="badge bg-info text-dark text-uppercase fw-bold px-3 py-2 mt-2 shadow-sm">
              {{ usuario.rol }}
            </span>
          </div>
        </div>

        <div class="card-body p-5 bg-white">
          <div class="row">
            
            <div class="col-md-5 border-end">
              <h5 class="text-muted fw-bold mb-4 border-bottom pb-2">Información Institucional</h5>
              
              <div class="mb-4">
                <label class="text-muted small d-block">Número de Carnet</label>
                <div class="fw-bold fs-5 text-primary">{{ usuario.carnet }}</div>
              </div>

              <div class="mb-3">
                <label class="text-muted small d-block">Cursos actuales</label>
                <div class="d-flex flex-wrap gap-2 mt-2">
                  <span *ngFor="let c of usuario.cursos" class="badge bg-secondary px-3 py-2">
                    <i class="bi bi-book me-1"></i> {{ c }}
                  </span>
                  <em *ngIf="usuario.cursos?.length === 0" class="text-muted small">Sin cursos registrados.</em>
                </div>
              </div>
            </div>

            <div class="col-md-7 ps-md-5">
              <h5 class="text-success fw-bold mb-4 border-bottom pb-2">Configuración de Cuenta</h5>
              
              <div class="mb-3">
                <label class="form-label fw-bold">Correo Electrónico</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control" [(ngModel)]="emailEdit">
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-bold">Cambiar Contraseña</label>
                <div class="input-group">
                  <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                  <input type="password" class="form-control" [(ngModel)]="passEdit" placeholder="Nueva contraseña">
                </div>
                <small class="text-muted mt-1 d-block italic">Deja este campo vacío si no deseas cambiarla.</small>
              </div>

              <button class="btn btn-success w-100 fw-bold py-3 shadow-sm mt-3" (click)="guardarCambios()">
                <i class="bi bi-save2-fill me-2"></i> Actualizar Mi Perfil
              </button>
            </div>

          </div>
        </div>
      </div>

    </div>
  </div>
</div>
